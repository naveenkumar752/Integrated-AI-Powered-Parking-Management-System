<!-- myapp/templates/result.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
    <div class="container text-center animate__animated animate__fadeInUp">
        <h1>Result</h1>
        {% if captured_image_path %}
        <img class="img-fluid rounded shadow-lg" src="/media/processed_images/captured_image.jpg" alt="Processed Image"><br>
        <a href="{% url 'index' %}" class="text-center">
            <button type="button" class="btn btn-primary " style="background-color: coral; border-color: white;">Get Started</button>
        </a>
        <p>Slot Allotted: {{ parking_slot }}</p>
        <p>Entry Time: {{ entry_time }}</p>
       
        {% else %}
        <div class="alert alert-danger" role="alert">
            {{ error_message }}
        </div>
        {% endif %}
    </div>

</body>

</html>
