<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Block</title>
    <script>
        var startTime = new Date();

        function updateTime() {
            var currentTime = new Date();
            var timeDiff = currentTime - startTime;
            var seconds = Math.floor(timeDiff / 1000);
            var minutes = Math.floor(seconds / 60);
            var hours = Math.floor(minutes / 60);
            minutes %= 60;
            seconds %= 60;

            document.getElementById("time-counter").innerHTML = hours + "h " + minutes + "m " + seconds + "s";
        }

        setInterval(updateTime, 1000);
    </script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
  


    <div class="col-5 mt-5 mx-auto card animate__animated animate__fadeInUp  text-center shadow-lg ">
        <h1 class="text-light bg-warning p-3 ">Parking Block</h1>
        <p>License Plate Number: {{ lp_number }}</p>
        <p>Parking Slot Number: {{ slot_number }}</p>
        <p>Time Elapsed: <span id="time-counter">0h 0m 0s</span></p>
        <form action="{% url 'end_parking_transaction' %}" method="post">
            {% csrf_token %}
            <input type="hidden" name="slot_number" value="{{ slot_number }}">
            <input type="hidden" name="lpnum" value="{{ lp_number }}">
            <button class="btn btn-outline-warning my-3" type="submit">Vehicle has left</button>
        </form>

    </div>

</body>

</html>
